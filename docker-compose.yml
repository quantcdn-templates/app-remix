# Quant Cloud: run on X86_64 to match images built on standard GitHub runners.
x-quant-labels:
  quant.architecture: X86_64

services:
  app:
    image: ghcr.io/quantcdn-templates/app-remix:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
