# Quant Cloud: run on ARM64 to match the arm64 images the org builds.
x-quant-labels:
  quant.architecture: ARM64

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
